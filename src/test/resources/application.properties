# Perfil de pruebas: PostgreSQL real embebido (io.zonky.test:embedded-postgres,
# arrancado en AbstractLogiTrackIqTest via @DynamicPropertySource) en vez de
# la Postgres remota de src/main/resources/application.properties. Al ser
# Postgres real, se reutiliza TAL CUAL el schema.sql de produccion (via
# classpath*:schema.sql, resuelto automaticamente porque este modulo de
# test no tiene su propio schema.sql) — incluidos los enums nativos que
# usan Usuario.rol/Movimiento.tipo/Auditoria.tipoOperacion/OrdenCompra.estado
# (@JdbcTypeCode(NAMED_ENUM)), que en H2 no se comportan igual (ver
# docs/sdd/03-diseno.md). data.sql SI se pin-ea a un archivo de test vacio
# para no cargar los datos de demo: cada prueba siembra lo que necesita
# (ver AbstractLogiTrackIqTest).
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

jwt.secret=0123456789abcdef0123456789abcdef-test-secret-key-do-not-use-in-prod
jwt.expiration-ms=3600000

logging.level.org.springframework.security=WARN
